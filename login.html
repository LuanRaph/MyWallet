<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <body>
      <nav
        id="inicio"
        class="navbar navbar-expand-md border border-bottom-1 border-body bg-secondary bg-opacity-25 sticky-top"
      >
        <div class="container-fluid">
          <a href="#" class="navbar-brand text-light fw-bold"
            ><strong id="logo">My</strong>Wallet</a
          >
          <form>
            <button
              onclick="dark_mode()"
              type="button"
              class="btn btn-link text-nowrap text-light btn-lg"
            >
              <i id="icon_mode" class="bi bi-moon-stars-fill"></i>
            </button>
          </form>
        </div>
      </nav>

      <div class="d-flex justify-content-center align-items-center mt-5">
        <div style="width: 100%; max-width: 420px">
          <div id="form-login">
            <h4 class="text-center mb-4">Bem vindo de volta!</h4>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="login-email" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" id="login-senha" class="form-control" />
            </div>
            <p id="erro-login" class="text-danger d-none"></p>
            <button
              onclick="login()"
              class="btn w-100 rounded-4 text-white"
              style="background-color: rgb(0, 207, 69)"
            >
              Entrar
            </button>
            <p class="text-center mt-3">
              Não tem conta?
              <a
                href="#"
                onclick="mostrarCadastro()"
                class="text-success fw-bold"
                >Cadastre-se</a
              >
            </p>
          </div>

          <div id="form-cadastro" class="d-none">
            <h4 class="text-center mb-4">Crie sua conta!</h4>
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" id="cad-nome" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="cad-email" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" id="cad-senha" class="form-control" />
            </div>
            <p id="erro-cadastro" class="text-danger d-none"></p>
            <button
              onclick="cadastro()"
              class="btn w-100 rounded-4 text-white"
              style="background-color: rgb(0, 207, 69)"
            >
              Criar conta
            </button>
            <p class="text-center mt-3">
              Já tem conta?
              <a href="#" onclick="mostrarLogin()" class="text-success fw-bold"
                >Faça login</a
              >
            </p>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
      <script src="js/login.js"></script>
    </body>
  </body>
</html>
